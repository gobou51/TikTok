<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>リスナーページ｜メンテナンス中です</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="現在、サービスはメンテナンス中です。ご不便をおかけし申し訳ございません。">
    <meta name="robots" content="noindex, nofollow">

    <link rel="stylesheet" href="css/main.css">

    <style>
        /* メンテナンスページ専用スタイル */
        .maintenance-wrapper {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 80vh;
            padding: 20px;
        }

        .maintenance-container {
            background-color: #fff;
            padding: 30px 20px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            max-width: 600px;
            width: 90%;
            text-align: center;
            border-top: solid 2px #404040;
            border-bottom: solid 2px #404040;
        }

        .maintenance-icon {
            font-size: 3.5rem;
            margin-bottom: 20px;
            color: #FFD700;
        }

        .maintenance-title {
            font-size: 1.8rem;
            color: #333;
            margin-top: 0;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .maintenance-message {
            font-size: 1rem;
            line-height: 1.7;
            margin-bottom: 25px;
            color: #555;
        }

        .maintenance-time {
            font-size: 0.95rem;
            color: #777;
            margin-bottom: 10px;
        }
    </style>
</head>

<body>
    <div class="maintenance-wrapper">
        <div class="maintenance-container">
            <div class="maintenance-icon" aria-hidden="true">🚧</div>

            <h1 class="maintenance-title">現在メンテナンス中です</h1>
            <p class="maintenance-message">
                いつもご利用いただきありがとうございます。<br>
                ただいま、システムメンテナンスを実施しております。<br>
                皆様には大変ご不便をおかけいたしますが、作業終了まで今しばらくお待ちいただけますようお願い申し上げます。
            </p>
            <p class="maintenance-time">
                <strong>終了予定：</strong> 未定
            </p>
        </div>
    </div>
</body>

</html>
