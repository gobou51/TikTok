<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ごぼうの動画ギャラリー</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 20px;
            background-color: #f4f4f4;
        }

        h1 {
            text-align: center;
        }

        .thumbnail-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .thumbnail {
            cursor: pointer;
            overflow: hidden;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            background-color: #fff;
        }

        .thumbnail:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
        }

        .thumbnail img {
            width: 100%;
            height: auto;
            display: block;
        }

        .thumbnail .title {
            padding: 10px 15px;
            text-align: center;
            font-weight: bold;
            color: #333;
            font-size: 15px;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            position: relative;
            width: 80%;
            max-width: 800px;
        }

        .video-wrapper {
            position: relative;
            padding-bottom: 56.25%;
            /* 16:9 */
            height: 0;
            overflow: hidden;
            background-color: #000;
        }

        .video-wrapper video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .close-button {
            position: absolute;
            top: -50px;
            right: 0;
            color: #fff;
            font-size: 35px;
            font-weight: bold;
            cursor: pointer;
            transition: color 0.3s ease;
        }

        .close-button:hover,
        .close-button:focus {
            color: #bbb;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <h1>ごぼうの動画ギャラリー</h1>

    <div class="thumbnail-container">

        <div class="thumbnail" data-video-src="movies/0707.mp4">
            <img src="thumbnail/0707.png" alt="ゲームアリーナ202507">
            <hr>
            <div class="title">ゲームアリーナ202507</div>
        </div>

    </div>
    <div id="videoModal" class="modal">
        <div class="modal-content">
            <span class="close-button">×</span>
            <div class="video-wrapper">
                <video id="modalVideo" src="" controls autoplay muted></video>
            </div>
        </div>
    </div>


    <script>
        document.addEventListener('DOMContentLoaded', function () {

            const modal = document.getElementById('videoModal');
            const modalVideo = document.getElementById('modalVideo');
            const closeButton = document.querySelector('.close-button');
            const thumbnails = document.querySelectorAll('.thumbnail');
            
            modal.style.display = 'none';

            thumbnails.forEach(thumbnail => {
                thumbnail.addEventListener('click', function () {
                    const videoSrc = this.getAttribute('data-video-src');
                    modalVideo.src = videoSrc;
                    modal.style.display = 'flex';
                });
            });

            function closeModal() {
                modal.style.display = 'none';
                modalVideo.pause();
                modalVideo.src = '';
            }

            closeButton.addEventListener('click', closeModal);

            modal.addEventListener('click', function (event) {
                if (event.target === modal) {
                    closeModal();
                }
            });
        });
    </script>

</body>

</html>
